[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuforge"
version = "0.1.0"
description = "Local, physics-backed RC filter simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
circuforge = "circuforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a real ngspice executable"]
